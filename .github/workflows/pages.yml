name: Deploy Sandustry modding docs

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble static site
        shell: bash
        run: |
          mkdir _site
          cp index.html llms.txt ai-context.md apireference.md modstructure.md textureconfig.md patching.md custommaps.md _site/
          cp -R docs _site/docs
          node .research/docs-dev/build-api-data.js apireference.md _site/docs/assets/api-data.js
          node .research/docs-dev/build-llms-full.js _site/llms-full.txt
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
